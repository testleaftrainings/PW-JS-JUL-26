🚀 Day 05 – Playwright Configuration, XPath & Advanced Locator Strategies

================================================================================
        PLAYWRIGHT defineConfig() - COMPLETE CONFIGURATION REFERENCE
================================================================================


1. EXECUTION CONFIGURATION
================================================================================

testDir
--------------------------------------------------------------------------------
Description: Directory containing test files
Default: 'tests'
Example: testDir: './src/tests'

testMatch
--------------------------------------------------------------------------------
Description: Pattern to identify test files (glob patterns)
Default: '**/*.@(spec|test).?(c|m)[jt]s?(x)'
Example: testMatch: '**/*.test.ts'

testIgnore
--------------------------------------------------------------------------------
Description: Files/folders to exclude from test discovery
Default: []
Example: testIgnore: ['**/node_modules/**', '**/dist/**']

grep
--------------------------------------------------------------------------------
Description: Run only tests matching the pattern (title or tag)
Default: undefined
Example: grep: /@smoke/

grepInvert
--------------------------------------------------------------------------------
Description: Exclude tests matching the pattern
Default: undefined
Example: grepInvert: /@slow/

timeout
--------------------------------------------------------------------------------
Description: Maximum execution time per test in milliseconds
Default: 30000 (30 seconds)
Example: timeout: 60000  // 60 seconds

expect.timeout
--------------------------------------------------------------------------------
Description: Maximum timeout for assertions in milliseconds
Default: 5000 (5 seconds)
Example: expect: { timeout: 10000 }

fullyParallel
--------------------------------------------------------------------------------
Description: Execute tests in parallel across all files (no serial mode)
Default: true
Example: fullyParallel: true

workers
--------------------------------------------------------------------------------
Description: Number of worker processes for parallel execution
Default: CPU cores / 2
Example: workers: 4
         workers: process.env.CI ? 2 : undefined

retries
--------------------------------------------------------------------------------
Description: Retry failed tests N times
Default: 0
Example: retries: 2
         retries: process.env.CI ? 2 : 0

repeatEach
--------------------------------------------------------------------------------
Description: Execute each test multiple times (useful for flakiness detection)
Default: 0
Example: repeatEach: 3

maxFailures
--------------------------------------------------------------------------------
Description: Stop test execution after N failures
Default: 0 (no limit)
Example: maxFailures: 5

forbidOnly
--------------------------------------------------------------------------------
Description: Fail if test.only() exists (prevents accidental focused tests in CI)
Default: false
Example: forbidOnly: !!process.env.CI


================================================================================
2. BROWSER CONFIGURATION (use)
================================================================================

browserName
--------------------------------------------------------------------------------
Description: Browser engine to use
Allowed: 'chromium' | 'firefox' | 'webkit'
Default: 'chromium'
Example: browserName: 'firefox'

channel
--------------------------------------------------------------------------------
Description: Browser channel (use installed browser instead of downloaded)
Allowed: 'chrome', 'msedge', 'chrome-beta', 'msedge-beta', etc.
Default: undefined
Example: channel: 'chrome'

headless
--------------------------------------------------------------------------------
Description: Run browser in headless (no UI) or headed (with UI) mode
Default: true
Example: headless: false
         headless: process.env.CI ? true : false

viewport
--------------------------------------------------------------------------------
Description: Browser viewport size {width, height}
Default: { width: 1280, height: 720 }
Example: viewport: { width: 1920, height: 1080 }
         viewport: null  // Maximize window

screen
--------------------------------------------------------------------------------
Description: Screen resolution (emulates screen size for media queries)
Default: Same as viewport
Example: screen: { width: 1920, height: 1080 }

deviceScaleFactor
--------------------------------------------------------------------------------
Description: Device pixel ratio (DPI scaling)
Default: 1
Example: deviceScaleFactor: 2  // Retina display

isMobile
--------------------------------------------------------------------------------
Description: Enable mobile emulation
Default: false
Example: isMobile: true

hasTouch
--------------------------------------------------------------------------------
Description: Enable touch events
Default: false
Example: hasTouch: true

userAgent
--------------------------------------------------------------------------------
Description: Custom user-agent string
Default: Browser default
Example: userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 15_0...)'

locale
--------------------------------------------------------------------------------
Description: Browser locale (affects language, date formats, etc.)
Allowed: Locale codes like 'en-US', 'fr-FR', 'hi-IN'
Default: 'en-US'
Example: locale: 'hi-IN'

timezoneId
--------------------------------------------------------------------------------
Description: Browser timezone
Allowed: Timezone IDs like 'Asia/Kolkata', 'America/New_York'
Default: System timezone
Example: timezoneId: 'Asia/Kolkata'

colorScheme
--------------------------------------------------------------------------------
Description: Light or dark mode preference
Allowed: 'light' | 'dark' | 'no-preference'
Default: 'light'
Example: colorScheme: 'dark'

reducedMotion
--------------------------------------------------------------------------------
Description: Reduced motion preference (accessibility)
Allowed: 'reduce' | 'no-preference'
Default: 'no-preference'
Example: reducedMotion: 'reduce'

forcedColors
--------------------------------------------------------------------------------
Description: Forced colors accessibility mode
Allowed: 'active' | 'none'
Default: 'none'
Example: forcedColors: 'active'


================================================================================
3. NETWORK CONFIGURATION
================================================================================

baseURL
--------------------------------------------------------------------------------
Description: Base URL for page.goto() and API requests (relative paths resolve to this)
Default: undefined
Example: baseURL: 'https://qa.example.com'
         use: { baseURL: process.env.BASE_URL || 'https://qa.example.com' }

proxy
--------------------------------------------------------------------------------
Description: Proxy configuration for all requests
Format: { server: 'http://proxy:8080', bypass: 'localhost,*.example.com' }
Default: undefined
Example: proxy: { server: 'http://myproxy:8080' }

offline
--------------------------------------------------------------------------------
Description: Simulate offline mode (network requests will fail)
Default: false
Example: offline: true

extraHTTPHeaders
--------------------------------------------------------------------------------
Description: Headers added to every HTTP request
Default: {}
Example: extraHTTPHeaders: {
             'X-API-Key': 'abc123',
             'X-Environment': 'QA'
         }

httpCredentials
--------------------------------------------------------------------------------
Description: HTTP Basic Authentication credentials
Format: { username: 'user', password: 'pass' }
Default: undefined
Example: httpCredentials: {
             username: 'admin',
             password: 'admin123'
         }

ignoreHTTPSErrors
--------------------------------------------------------------------------------
Description: Ignore SSL certificate validation errors
Default: false
Example: ignoreHTTPSErrors: true


================================================================================
4. AUTHENTICATION & STORAGE
================================================================================

storageState
--------------------------------------------------------------------------------
Description: Reuse authentication state (cookies + localStorage) from a JSON file
Default: undefined
Example: storageState: 'auth.json'
         // Generates: page.context().storageState({ path: 'auth.json' })

permissions
--------------------------------------------------------------------------------
Description: Grant browser permissions automatically
Allowed: 'geolocation', 'notifications', 'camera', 'microphone', 'clipboard-read', etc.
Default: []
Example: permissions: ['geolocation', 'notifications']

geolocation
--------------------------------------------------------------------------------
Description: Mock GPS location (requires permissions: ['geolocation'])
Format: { latitude: number, longitude: number, accuracy?: number }
Default: undefined
Example: geolocation: { latitude: 13.0827, longitude: 80.2707 }



5. DEBUGGING & ARTIFACTS
================================================================================

trace
--------------------------------------------------------------------------------
Description: Capture Playwright trace (click-by-click debugging)
Allowed: 'on' | 'off' | 'retain-on-failure' | 'on-first-retry'
Default: 'off'
Example: trace: 'retain-on-failure'

screenshot
--------------------------------------------------------------------------------
Description: Screenshot capture strategy
Allowed: 'on' | 'off' | 'only-on-failure'
Default: 'off'
Example: screenshot: 'only-on-failure'

video
--------------------------------------------------------------------------------
Description: Video recording strategy
Allowed: 'on' | 'off' | 'retain-on-failure' | 'on-first-retry'
Default: 'off'
Example: video: 'retain-on-failure'

acceptDownloads
--------------------------------------------------------------------------------
Description: Automatically accept file downloads
Default: true
Example: acceptDownloads: true

actionTimeout
--------------------------------------------------------------------------------
Description: Timeout for user actions (click, fill, etc.) in milliseconds
Default: 10000 (10 seconds)
Example: actionTimeout: 15000

navigationTimeout
--------------------------------------------------------------------------------
Description: Timeout for page navigation in milliseconds
Default: 30000 (30 seconds)
Example: navigationTimeout: 60000



                    CLASSROOM ACTIVITY: XPATH & CSS SELECTORS
================================================================================

DESCRIPTION:
--------------------------------------------------------------------------------
This hands-on activity is designed to help you gain practical experience in
automating web application interactions using Playwright. You will learn to
locate web elements using various CSS selector strategies and implement XPath-
based locators to identify and interact with form fields on the Salesforce
login page. The activity also reinforces the importance of validation by
verifying successful login through element presence on the landing page.

OBJECTIVES:
--------------------------------------------------------------------------------
1. To understand and apply different CSS selector strategies (ID, Class, and
   Attribute) for locating web elements.
2. To implement XPath selector strategies for locating the username and
   password fields, as well as the login button.
3. To automate the process of entering credentials and submitting a login form.
4. To verify login success by detecting a specific element on the post-login
   landing page.
5. To compare and contrast CSS selectors and XPath for element identification
   in real-world scenarios.

TASKS TO PERFORM:
--------------------------------------------------------------------------------
1. Navigate to the Salesforce login page.
2. Use different CSS selector strategies (ID, Class, and Attribute) to locate
   the username and password fields.
3. Use XPath selectors (Absolute, Relative, and Attribute-based) to also locate
   the username and password fields.
4. Enter the sample credentials into the username and password fields.
5. Click the login button using both CSS and XPath selectors.
6. Verify that the login was successful by checking for a specific element on
   the landing page.


================================================================================
                              XPATH IN PLAYWRIGHT
================================================================================

ATTRIBUTE PRIORITY
================================================================================

When choosing attributes for locating elements, follow this priority order:

┌─────────────────────────────────────────────────────────────────────────────┐
│ Priority │ Attribute    │ Reason                                            │
├──────────┼──────────────┼───────────────────────────────────────────────────┤
│ 1️⃣       │ aria-label   │ Accessibility-based, stable, first choice        │
│ 2️⃣       │ id           │ Unique, fast                                     │
│ 3️⃣       │ name         │ Usually stable, not always unique                │
│ 4️⃣       │ class        │ For styling, changes often → least reliable      │
└──────────┴──────────────┴───────────────────────────────────────────────────┘


================================================================================
                    XPATH - TWO TYPES
================================================================================

1. Absolute XPath
2. Relative XPath

1. ABSOLUTE XPATH:
--------------------------------------------------------------------------------
Starts from the root of the HTML document (/html).
Full path from root to the element.
Brittle - breaks if DOM structure changes.

Example:
/html/body/div[2]/div[2]/div/form/p/input


2. RELATIVE XPATH:
--------------------------------------------------------------------------------
Starts from anywhere in the DOM (//).
More stable and preferred.
Does not depend on full path structure.

Two Types:
  A) Basic Relative XPath
  B) Advanced Relative XPath (Axes)


================================================================================
                    A) BASIC RELATIVE XPATH
================================================================================

1. Attribute Based XPath:
--------------------------------------------------------------------------------
SYNTAX:
  //tagName[@attribute='attributeValue']

EXAMPLE:
  //input[@id='username']

HTML:
  <input id="username">

2. Text Based XPath:
--------------------------------------------------------------------------------
SYNTAX:
  //tagName[text()='text value in DOM']

EXAMPLE:
  //button[text()='Login']

HTML:
  <button>Login</button>

3. Partial Attribute Based XPath:
--------------------------------------------------------------------------------
SYNTAX:
  //tagName[contains(@attribute, 'Partial value of the attribute')]

EXAMPLE:
  //input[contains(@id, 'user')]

HTML:
  <input id="user_12345">

4. Partial Text Based XPath:
--------------------------------------------------------------------------------
SYNTAX:
  //tagName[contains(text(), 'Partial text in my DOM')]

EXAMPLE:
  //button[contains(text(), 'Log')]

HTML:
  <button>Login</button>

5. Collection Based XPath (Index):
--------------------------------------------------------------------------------
SYNTAX:
  (//tagName[@attribute='attributeValue'])[index]

EXAMPLE:
  (//button[@class='btn'])[2]

HTML:
  <button class="btn">Save</button>
  <button class="btn">Delete</button>  ← This one (index 2)


================================================================================
                    B) ADVANCED RELATIVE XPATH (AXES)
================================================================================

Axes path: XPath based on relationship between elements.

1. PARENT TO CHILD:
--------------------------------------------------------------------------------
SYNTAX:
  //relative xpath of parent/child tag

EXAMPLE:
  //p[@class='top']/label

HTML:
  <p class="top">
    <label>Username</label>
  </p>

2. CHILD TO PARENT:
--------------------------------------------------------------------------------
SYNTAX:
  //relative xpath of child/parent::parent tag

EXAMPLE:
  //input[@id='password']/parent::p

HTML:
  <p>
    <input id="password">
  </p>

3. GRAND PARENT TO GRAND CHILD:
--------------------------------------------------------------------------------
SYNTAX:
  //relative xpath of grand parent//grand child tag

EXAMPLE:
  //form[@id='login']//label

HTML:
  <form id="login">
    <div>
      <label>Username</label>
    </div>
  </form>

4. GRAND CHILD TO GRAND PARENT:
--------------------------------------------------------------------------------
SYNTAX:
  //relative xpath of grand child/ancestor::grand parent tag

EXAMPLE:
  //input[@class='decorativeSubmit']/ancestor::form

HTML:
  <form>
    <div>
      <input class="decorativeSubmit">
    </div>
  </form>

5. ELDER SIBLING TO YOUNGER SIBLING:
--------------------------------------------------------------------------------
SYNTAX:
  //relative xpath of elder sibling/following-sibling::younger sibling tag

EXAMPLE:
  //label[text()='Username']/following-sibling::input

HTML:
  <label>Username</label>
  <input>  ← This one (following sibling)

6. YOUNGER SIBLING TO ELDER SIBLING:
--------------------------------------------------------------------------------
SYNTAX:
  //relative xpath of younger sibling/preceding-sibling::tag of elder sibling

EXAMPLE:
  //input[@id='username']/preceding-sibling::label

HTML:
  <label>Username</label>  ← This one (preceding sibling)
  <input id="username">

7. ELDER COUSIN TO YOUNGER COUSIN (Top to Bottom):
--------------------------------------------------------------------------------
SYNTAX:
  Elder cousin relative xpath/following::tagName of younger cousin

EXAMPLE 1:
  //input[@id="username"]/following::label

EXAMPLE 2:
  //input[@id="username"]/following::input

HTML:
  <div>
    <input id="username">
  </div>
  <div>
    <label>Email</label>  ← following label
    <input>               ← following input
  </div>

8. YOUNGER COUSIN TO ELDER COUSIN (Bottom to Top):
--------------------------------------------------------------------------------
SYNTAX:
  Younger cousin xpath/preceding::tagName of elder cousin

EXAMPLE:
  //label[text()='Password']/preceding::input

HTML:
  <div>
    <input>               ← preceding input
  </div>
  <div>
    <label>Password</label>  ← This is the starting element
  </div>

EXAMPLE WITH INDEX:
  (//input[@class="decorativeSubmit"]/preceding::input)[1]


================================================================================
                    QUICK REFERENCE TABLE
================================================================================

┌─────────────────────────────────────────────────────────────────────────────┐
│ Axes Type              │ Symbol/Keyword │ Direction                        │
├────────────────────────┼────────────────┼──────────────────────────────────┤
│ Parent to Child        │ /              │ Top → Bottom                     │
│ Child to Parent        │ parent::       │ Bottom → Top                     │
│ GP to GC               │ //             │ Top → Bottom (multiple levels)   │
│ GC to GP               │ ancestor::     │ Bottom → Top (multiple levels)   │
│ Elder → Younger Sibling│ following-     │ Left → Right (same level)        │
│                        │ sibling::      │                                  │
│ Younger → Elder Sibling│ preceding-     │ Right → Left (same level)        │
│                        │ sibling::      │                                  │
│ Elder → Younger Cousin │ following::    │ Top → Bottom (different levels)  │
│ Younger → Elder Cousin │ preceding::    │ Bottom → Top (different levels)  │
└────────────────────────┴────────────────┴──────────────────────────────────┘


================================================================================
                    BEST PRACTICES - XPATH IN PLAYWRIGHT
================================================================================

✅ PREFER CSS Selectors over XPath when possible
  CSS selectors are faster and more readable

✅ USE Role-based locators when available
  getByRole(), getByText(), getByLabel()

✅ AVOID Absolute XPath
  Breaks easily with DOM changes

✅ USE Relative XPath with stable attributes
  id, name, aria-label, data-testid

✅ USE Contains for dynamic values
  //tag[contains(@id, 'partial')]

✅ USE Axes for complex relationships
  When elements don't have unique attributes



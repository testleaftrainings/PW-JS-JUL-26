7. REPORTERS
================================================================================

REPORTERS AND THEIR OUTPUTS:
--------------------------------------------------------------------------------
list
  Description: Detailed console output with each test's status
  Example: reporter: 'list'

line
  Description: Single-line progress bar
  Example: reporter: 'line'

dot
  Description: Dot notation (one character per test)
  Example: reporter: 'dot'

html
  Description: Interactive HTML report (playwright-report/index.html)
  Example: reporter: 'html'

json
  Description: JSON format report
  Example: reporter: ['json', { outputFile: 'test-results.json' }]

junit
  Description: JUnit XML report (CI/CD integration)
  Example: reporter: ['junit', { outputFile: 'junit.xml' }]

blob
  Description: Binary blob report for merging multiple runs
  Example: reporter: ['blob']

github
  Description: GitHub Actions annotations
  Example: reporter: ['github']

MULTIPLE REPORTERS:
--------------------------------------------------------------------------------
reporter: [
    'list',
    ['html', { outputFolder: 'playwright-report' }],
    ['json', { outputFile: 'test-results.json' }],
    ['junit', { outputFile: 'junit.xml' }]
]



6. PROJECTS
================================================================================

PROJECT CONFIGURATION:
--------------------------------------------------------------------------------
Each project defines a separate test run with its own settings.

Description: Project definition for multi-browser or multi-config testing
Default: []
Example: projects: [
             {
                 name: 'Chrome',
                 use: { browserName: 'chromium' },
             },
             {
                 name: 'Firefox',
                 use: { browserName: 'firefox' },
             },
             {
                 name: 'Mobile Safari',
                 use: { ...devices['iPhone 15'] }
             }
         ]

name:
  Description: Unique project name
  Example: name: 'Chrome'

use:
  Description: Project-specific browser settings (overrides global use)
  Example: use: { browserName: 'chromium', headless: false }

dependencies:
  Description: Run dependent project before this project (setup projects)
  Example: dependencies: ['global-setup']

teardown:
  Description: Teardown project to run after this project
  Example: teardown: 'global-teardown'

metadata:
  Description: Additional metadata for reporting
  Example: metadata: { browser: 'Chrome', env: 'QA' }



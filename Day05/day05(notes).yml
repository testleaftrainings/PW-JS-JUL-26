Example: ['html', { attachmentsBaseURL: 'https://storage.example.com' }]


================================================================================
9. CI/CD RECOMMENDED CONFIGURATION
================================================================================

ENTERPRISE STANDARD:
--------------------------------------------------------------------------------
Use this configuration for Jenkins/GitHub Actions CI/CD pipelines.

retries
  Recommendation: process.env.CI ? 2 : 0
  Why: Retry flaky tests in CI, no retries locally

workers
  Recommendation: process.env.CI ? 1 : undefined
  Why: Run sequentially in CI for stability, parallel locally

forbidOnly
  Recommendation: !!process.env.CI
  Why: Fail CI if test.only() accidentally committed

reporter
  Recommendation: 'line' + 'html' + 'junit'
  Why: Console progress + HTML report + CI integration

trace
  Recommendation: 'retain-on-failure'
  Why: Debug failures with trace viewer

screenshot
  Recommendation: 'only-on-failure'
  Why: Save space, capture only failures

video
  Recommendation: 'retain-on-failure'
  Why: Video replay for failed tests only

COMPLETE CI EXAMPLE:
--------------------------------------------------------------------------------
import { defineConfig } from '@playwright/test';

export default defineConfig({
    retries: process.env.CI ? 2 : 0,
    workers: process.env.CI ? 1 : undefined,
    forbidOnly: !!process.env.CI,

    use: {
        trace: 'retain-on-failure',
        screenshot: 'only-on-failure',
        video: 'retain-on-failure',
        baseURL: process.env.BASE_URL || 'https://qa.example.com'
    },

    reporter: [
        'line',
        ['html', { open: 'never' }],
        ['junit', { outputFile: 'junit.xml' }]
    ],

    projects: [
        { name: 'Chrome', use: { browserName: 'chromium' } },
        { name: 'Firefox', use: { browserName: 'firefox' } }
    ]
});



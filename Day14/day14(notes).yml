================================================================================
                    1. PAGE OBJECT MODEL (POM)
================================================================================
POM is used to separate UI interaction logic from the test logic.

Instead of writing locators directly inside the test:
  await page.getByRole("textbox", { name: "Username" }).fill(username);
  await page.getByLabel("Password").fill(password);

we create a Page Object:
  export class LoginPage {
      constructor(private page: Page) {}

      async enterUsername(username: string) {
          await this.page
              .getByRole("textbox", { name: "Username" })
              .fill(username);
      }

      async enterPassword(password: string) {
          await this.page
              .getByLabel("Password", { exact: true })
              .fill(password);
      }
  }

The test then becomes:
  await SFlogin.enterUsername(username);
  await SFlogin.enterPassword(password);

MAIN PRINCIPLE:
────────────────────────────────────────────────────────────────────────────────
  Page Object contains UI implementation; Test contains business flow.

OUR PAGE OBJECTS:
────────────────────────────────────────────────────────────────────────────────
pages/
│
├── login.ts
├── home.ts
└── lead.ts

RESPONSIBILITIES:
────────────────────────────────────────────────────────────────────────────────
LoginPage:
  Username, Password, Login

HomePage:
  App Launcher, View All, Search Apps

LeadPage:
  Search Leads, Lead-related actions


================================================================================
                    2. DEPENDENCY INJECTION (DI)
================================================================================

Our Page Objects need Playwright's Page object.

Instead of creating the browser/page inside the Page Object, we INJECT the
existing Page instance.

  export class LoginPage {
      constructor(private page: Page) {}
  }

Then:
  const loginPage = new LoginPage(page);

WHAT IS HAPPENING?
────────────────────────────────────────────────────────────────────────────────
Playwright Test Runner
        │
        │ creates/provides Page
        ▼
      page
        │
        │ injected
        ▼
   LoginPage(page)

The constructor:
  constructor(private page: Page) {}

stores the received Page instance inside the object.

IMPORTANT TERMINOLOGY:
────────────────────────────────────────────────────────────────────────────────
This: page: Page is NOT a global variable. It is an instance property.

This: constructor(page: Page) is a constructor parameter.

This: this.page = page means:
  "Store the Page instance received from outside inside this Page Object."

WHY DI IS USEFUL:
────────────────────────────────────────────────────────────────────────────────
The same Playwright Page can be passed through different Page Objects:

Playwright Page
      │
      ├── LoginPage
      │
      ├── HomePage
      │
      └── LeadPage

They are all operating on the same browser page/session.

For example:
  return new HomePage(this.page);

does NOT create a new browser page. It creates a new HomePage object using the
existing Playwright Page.


================================================================================
                    3. FIXTURE PATTERN
================================================================================

After understanding POM and DI, we introduced Playwright fixtures.

PROBLEM WITHOUT FIXTURES:
────────────────────────────────────────────────────────────────────────────────
Every test would need to manually create objects:
  const loginPage = new LoginPage(page);
  const api = new SalesforceAPI(request);

This makes tests responsible for object creation.

FIXTURE SOLUTION:
────────────────────────────────────────────────────────────────────────────────
The fixture creates the objects and provides them to the test.

  type SalesforceObjects = {
      SFlogin: LoginPage;
      SFapi: SalesforceAPI;
  };

Then:
  export const test = baseTest.extend<SalesforceObjects>({
      SFlogin: async ({ page }, use) => {
          await page.goto("https://...salesforce.com/");
          await use(new LoginPage(page));
      },
      SFapi: async ({ request }, use) => {
          const api = new SalesforceAPI(request);
          await api.generateToken();
          await use(api);
      }
  });

Now the test receives:
  test("scenario", async ({ SFlogin, SFapi }) => {

FIXTURE RESPONSIBILITY:
────────────────────────────────────────────────────────────────────────────────
The fixture is responsible for:
  Setup → Create object → Inject dependency → Provide object to test

IMPORTANT DISTINCTION:
────────────────────────────────────────────────────────────────────────────────
Fixture does NOT replace the constructor.

Instead:
  Fixture → page → new LoginPage(page) → LoginPage

The constructor is still responsible for receiving the dependency.


================================================================================
                    4. API UTILITY / API SERVICE LAYER
================================================================================

Next, we integrated API testing into the framework.

Initially, we had functions like:
  generateToken(request)
  createResource(request)
  fetchResource(request)

But we identified a problem with global variables:
  let SF_Access_Token;
  let appUrl;
  let leadId;

These create shared mutable state and are not a good design for parallel
execution.

So we moved toward an API class:
  export class SalesforceAPI {
      private SF_Access_Token!: string;
      private appUrl!: string;

      constructor(private request: APIRequestContext) {}
  }

API DEPENDENCY INJECTION:
────────────────────────────────────────────────────────────────────────────────
Just like:
  LoginPage(page)

we now have:
  SalesforceAPI(request)

So:
  Playwright
     │
     ├── Page → LoginPage
     │
     └── APIRequestContext → SalesforceAPI

API SERVICE RESPONSIBILITIES:
────────────────────────────────────────────────────────────────────────────────

Generate token:
  await this.generateToken();
  The token and instance URL are stored inside the API object.
  generateToken() → accessToken, instanceUrl

Create Lead:
  const leadId = await SFapi.createResource();
  The method returns the created Lead ID.

Fetch Lead:
  const lead = await SFapi.fetchResource(leadId);
  The Lead ID is explicitly passed into the method.

This is better than:
  fetchResource() secretly depending on a global leadId.


================================================================================
                    5. API + UI TEST FLOW
================================================================================

This was the final integration we learned today.

The goal was:
  "Create test data using API and validate/use that data through the UI."

The complete flow is:
                    TEST
                     │
                     ▼
              SalesforceAPI
                     │
                     ▼
              Generate Token
                     │
                     ▼
               Create Lead
                     │
                     ▼
                  leadId
                     │
                     ▼
               Fetch Lead
                     │
                     ▼
                LastName
                     │
                     ▼
                 UI Test
                     │
                     ▼
                LoginPage
                     │
                     ▼
                HomePage
                     │
                     ▼
                LeadPage
                     │
                     ▼
             Search LastName

EXAMPLE:
────────────────────────────────────────────────────────────────────────────────
API creates a Lead:
  const leadId = await SFapi.createResource();
  leadId = "00Q123456"

Then fetch:
  const lead = await SFapi.fetchResource(leadId);

Salesforce returns:
  {
      "FirstName": "Bhuvanesh",
      "LastName": "M",
      "Company": "Alphabet - ENG"
  }

Then:
  const lastName = lead.LastName;

Now:
  API → "M" → UI → Search Leads → "M"


================================================================================
                    6. PAGE-TO-PAGE OBJECT TRANSITION
================================================================================

Another important learning from today's implementation was that Page Objects
can return other Page Objects when the application navigates to another logical
page.

For example:
  async clickLoginButton() {
      await this.page
          .getByRole("button", { name: "Log In" })
          .click();
      return new HomePage(this.page);
  }

So:
  const homePage = await SFlogin.clickLoginButton();

means:
  LoginPage → Login → HomePage

Similarly:
  async openLeads() {
       await this.page.
            getByRole('link', { name: 'Leads', exact:true })
            .click();

      return new LeadPage(this.page);
  }

Then:
  const leadPage = await homePage.openLeads();

gives:
  HomePage → Open Leads → LeadPage

This keeps the Page Object model aligned with the application's navigation.


================================================================================
                    7. FINAL FRAMEWORK ARCHITECTURE
================================================================================

The architecture we arrived at today is:

                         TEST
                           │
             ┌─────────────┴─────────────┐
             │                           │
             ▼                           ▼
          UI FLOW                     API FLOW
             │                           │
             ▼                           ▼
         SFlogin                       SFapi
             │                           │
             ▼                           ▼
        LoginPage                  SalesforceAPI
             │                           │
             ▼                           ├── generateToken()
        HomePage                         ├── createResource()
             │                           └── fetchResource()
             ▼
        LeadPage

And the dependencies are supplied by fixtures:
                    FIXTURE
                       │
          ┌────────────┴────────────┐
          │                         │
          ▼                         ▼
       { page }                  { request }
          │                         │
          ▼                         ▼
     LoginPage                 SalesforceAPI


================================================================================
                    8. DESIGN PATTERNS / CONCEPTS USED
================================================================================

┌─────────────────────────────────────────────────────────────────────────────┐
│ Concept                    │ Purpose                                        │
├────────────────────────────┼────────────────────────────────────────────────┤
│ POM                        │ Encapsulate UI locators/actions               │
│ Dependency Injection       │ Inject Page / APIRequestContext               │
│ Fixture Pattern            │ Centralize setup and object creation          │
│ API Service Layer          │ Encapsulate Salesforce API operations         │
│ Page Object Transition     │ LoginPage → HomePage → LeadPage               │
│ API + UI Integration       │ API creates data, UI validates/uses it        │
│ Test Data Flow             │ leadId → Lead → LastName → UI                 │
└────────────────────────────┴────────────────────────────────────────────────┘


================================================================================
                    9. IMPORTANT THINGS TO REMEMBER
================================================================================

POM:
────────────────────────────────────────────────────────────────────────────────
Test → Business flow
Page Object → UI implementation

DI:
────────────────────────────────────────────────────────────────────────────────
Don't create Page inside Page Object.
Inject it: new LoginPage(page)

Fixture:
────────────────────────────────────────────────────────────────────────────────
Fixture creates and supplies objects.
Test consumes them.

API Layer:
────────────────────────────────────────────────────────────────────────────────
Don't keep test state unnecessarily in global variables.
Prefer:
  createLead() → leadId
  getLead(leadId) → lead

Page Transition:
────────────────────────────────────────────────────────────────────────────────
LoginPage → HomePage
HomePage → LeadPage

API + UI:
────────────────────────────────────────────────────────────────────────────────
API → Create data → Get data → Extract required value → UI → Use/validate
the data


================================================================================
                    10. ONE COMPLETE MENTAL MODEL
================================================================================

When designing this framework in the future, think in this order:

1. POM
   ↓
   What UI pages do I have?

2. DI
   ↓
   What dependencies do those pages need?

3. FIXTURE
   ↓
   Who should create and provide those objects?

4. API SERVICE
   ↓
   What backend operations should be reusable?

5. API + UI FLOW
   ↓
   How does data created through API enter the UI test?

THE FINAL PRINCIPLE:
────────────────────────────────────────────────────────────────────────────────
"POM manages UI behavior. DI supplies dependencies. Fixtures manage object
creation/setup. API Service manages backend operations. The Test coordinates
the business scenario and the data flow between API and UI."

This is the core architecture you learned today and is a good reference model
for extending your Playwright TypeScript framework.


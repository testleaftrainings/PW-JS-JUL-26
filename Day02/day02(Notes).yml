7. CONDITIONAL STATEMENTS - IF STATEMENT
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Used to evaluate logical conditions (true / false).

EXECUTION BEHAVIOUR:
--------------------------------------------------------------------------------
  • Evaluates condition expression
  • Executes block only if condition is true
  • Supports relational and logical operators
  • Multiple conditions supported
  • Executes top-to-bottom

FALSY VALUES IN JAVASCRIPT (Only 8 values are falsy):
--------------------------------------------------------------------------------
  false
  0
  -0
  0n (BigInt zero)
  "" (empty string)
  null
  undefined
  NaN

KEY CHARACTERISTICS:
--------------------------------------------------------------------------------
  • Can evaluate complex expressions
  • Best suited for range-based conditions
  • Uses >, <, >=, <=, &&, ||
  • Stops after first true condition
  • Flexible and dynamic

USE CASES:
--------------------------------------------------------------------------------
  • Marks grading system
  • Age validation
  • Tax slab calculation
  • Form validation logic


================================================================================
8. SWITCH STATEMENT
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Used for exact value matching.

EXECUTION BEHAVIOUR:
--------------------------------------------------------------------------------
  • Evaluates expression once
  • Compares using strict equality (===)
  • Matches only exact values
  • Executes matching case block
  • Requires break to stop fall-through

SYNTAX:
switch (expression) {
   case value1:
      // executes if expression === value1
      break;
   case value2:
      break;
   default:
      // executes if no match
}


================================================================================
9. ITERATION STATEMENTS - FOR LOOP
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Used when the number of iterations is known or count-controlled.

EXECUTION BEHAVIOUR:
--------------------------------------------------------------------------------
  • Executes in three parts: initialization → condition → increment/decrement
  • Condition is checked before each iteration
  • Stops when condition becomes false
  • Suitable for counter-based repetition

SYNTAX:
for (initialization; condition; increment) {
   // repeated block
}

FLOW ORDER:
--------------------------------------------------------------------------------
  1. Initialization runs once
  2. Condition checked
  3. Block executes if true
  4. Increment runs
  5. Condition rechecked

KEY CHARACTERISTICS:
--------------------------------------------------------------------------------
  • Best for fixed iteration count
  • Loop variable usually declared inside
  • Clear and compact structure
  • Risk of infinite loop if condition never becomes false

USE CASES:
--------------------------------------------------------------------------------
  • Iterating arrays
  • Number-based loops
  • Index-controlled logic


================================================================================
10. WHILE LOOP
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Used when number of iterations is unknown and depends on condition.

EXECUTION BEHAVIOUR:
--------------------------------------------------------------------------------
  • Condition checked first
  • Executes only if condition is true
  • May execute zero times

SYNTAX:
while (condition) {
   // repeated block
}

FLOW ORDER:
--------------------------------------------------------------------------------
  1. Condition checked
  2. If true → block executes
  3. After execution → condition rechecked

KEY CHARACTERISTICS:
--------------------------------------------------------------------------------
  • Entry-controlled loop
  • Best for dynamic conditions
  • Must manually control increment inside block
  • High risk of infinite loop if update missing

USE CASES:
--------------------------------------------------------------------------------
  • Waiting for user input
  • Polling mechanism
  • Conditional repetition


================================================================================
11. DO...WHILE LOOP
================================================================================

DEFINITION:
--------------------------------------------------------------------------------
Executes block at least once, regardless of condition.

EXECUTION BEHAVIOUR:
--------------------------------------------------------------------------------
  • Block executes first
  • Condition checked after execution
  • Continues if condition is true

SYNTAX:
do {
   // repeated block
} while (condition);

FLOW ORDER:
--------------------------------------------------------------------------------
  1. Block executes
  2. Condition checked
  3. If true → repeat

KEY CHARACTERISTICS:
--------------------------------------------------------------------------------
  • Exit-controlled loop
  • Guaranteed minimum one execution
  • Useful for validation scenarios

USE CASES:
--------------------------------------------------------------------------------
  • Menu-driven programs
  • Input validation
  • Retry mechanisms


================================================================================
                    INTERVIEW QUESTIONS & ANSWERS
================================================================================


Q1: What is the difference between var, let, and const?
--------------------------------------------------------------------------------
ANSWER:
  var: Function-scoped, can be redeclared, hoisted, available since ES5
  let: Block-scoped, cannot be redeclared, TDZ, introduced in ES6
  const: Block-scoped, cannot be reassigned or redeclared, must be initialized

Q2: What is Temporal Dead Zone (TDZ)?
--------------------------------------------------------------------------------
ANSWER:
  TDZ is the time between entering a block and the actual declaration of a
  variable using let or const. Accessing the variable during TDZ throws a
  ReferenceError.

Q3: What is hoisting in JavaScript?
--------------------------------------------------------------------------------
ANSWER:
  Hoisting is JavaScript's default behavior of moving declarations to the top
  of their scope during compilation. var declarations are hoisted, but let
  and const are not.

Q4: Why should we use let instead of var?
--------------------------------------------------------------------------------
ANSWER:
  let provides block scope, prevents accidental redeclaration, avoids hoisting
  confusion, and makes code more predictable and maintainable.

Q5: What are falsy values in JavaScript?
--------------------------------------------------------------------------------
ANSWER:
  The 8 falsy values are: false, 0, -0, 0n (BigInt zero), "" (empty string),
  null, undefined, NaN.

Q6: What is the difference between == and ===?
--------------------------------------------------------------------------------
ANSWER:
  == (Abstract Equality): Compares values after type coercion.
  === (Strict Equality): Compares values and types without coercion.

Q7: What is the difference between for, while, and do...while loops?
--------------------------------------------------------------------------------
ANSWER:
  for: Used when iteration count is known.
  while: Entry-controlled, condition checked before execution.
  do...while: Exit-controlled, executes at least once.

Q8: What is the difference between slice() and substring()?
--------------------------------------------------------------------------------
ANSWER:
  slice(): Accepts negative indices, end index excluded.
  substring(): Treats negative values as 0, end index excluded.

Q9: What is the difference between String Literal and String Object?
--------------------------------------------------------------------------------
ANSWER:
  Literal: let str = "Hello" → Creates primitive string (recommended).
  Object: let str = new String("Hello") → Creates String object (avoid).

Q10: What is the purpose of break in switch statement?
--------------------------------------------------------------------------------
ANSWER:
  break prevents fall-through behavior. Without break, execution continues to
  the next case regardless of matching.


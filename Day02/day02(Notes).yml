6. RELATIONAL OPERATORS
================================================================================

The relational operators determine the relationship that one operand has to
the other. Specifically, they determine equality and ordering.

OPERATORS:
--------------------------------------------------------------------------------
┌─────────────────────────────────────────────────────────────────────────────┐
│ Operator    │ Result                                                       │
├─────────────┼───────────────────────────────────────────────────────────────┤
│ ==          │ Equal to                                                     │
│ !=          │ Not equal to                                                 │
│ >           │ Greater than                                                 │
│ <           │ Less than                                                    │
│ >=          │ Greater than or equal to                                     │
│ <=          │ Less than or equal to                                        │
└─────────────┴───────────────────────────────────────────────────────────────┘

The outcome of these operations is a boolean value. The relational operators
are most frequently used in the expressions that control the if statement and
the various loop statements.


